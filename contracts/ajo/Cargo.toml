[package]
name = "soroban-ajo"
version = "0.1.0"
edition = "2021"
authors = ["Soroban Ajo Contributors"]
license = "MIT"
description = "Rotational savings and credit association (ROSCA) on Stellar Soroban"
repository = "https://github.com/Christopherdominic/soroban-ajo"
readme = "README.md"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Pinned to an exact version (not a caret range) by policy: this crate handles
# real financial value, and the SDK's `#[contracterror]` macro plus its
# transitive crypto dependencies (e.g. the rand/ed25519-dalek family) have a
# history of subtle, version-sensitive behavior. Bumping requires an explicit,
# reviewed PR that edits this line — see docs/DEPENDENCY_POLICY.md.
soroban-sdk = "=21.7.7"

[dev-dependencies]
soroban-sdk = { version = "=21.7.7", features = ["testutils"] }
proptest = "1.5.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
